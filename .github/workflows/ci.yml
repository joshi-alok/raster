name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main finish, so a production deploy is
  # never stopped between the docs and the studio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Build, lint, typecheck, unit tests, pack check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack-check

  # The e2e jobs run inside Playwright's image, as `pnpm e2e` does locally, so screenshots match the
  # Linux baselines. The image ships a newer Node and no corepack: pnpm/action-setup installs pnpm
  # (from `packageManager`) and setup-node puts the repository's Node from .nvmrc first on PATH.
  # Keep the tag in step with @playwright/test; `pnpm pack-check` fails otherwise.
  docs-e2e:
    name: Docs e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "1"
      HOME: /root # Firefox and Chromium in the image expect root's home
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @rasterdesign/docs exec playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-e2e-${{ matrix.shard }}
          path: apps/docs/test-results
          retention-days: 7

  studio-e2e:
    name: Studio e2e
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @rasterdesign/studio exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e
          path: apps/studio/test-results
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [check, docs-e2e, studio-e2e]
    # Secrets are not available to pull requests from forks or from Dependabot; those get no preview.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy production
        if: github.event_name == 'push'
        run: |
          pnpm exec wrangler deploy --config apps/docs/wrangler.jsonc
          pnpm exec wrangler deploy --config apps/studio/wrangler.jsonc
      - name: Upload previews
        if: github.event_name == 'pull_request'
        run: |
          alias="pr-${{ github.event.number }}"
          pnpm exec wrangler versions upload --config apps/docs/wrangler.jsonc --preview-alias "$alias"
          pnpm exec wrangler versions upload --config apps/studio/wrangler.jsonc --preview-alias "$alias"
      - name: Comment preview links
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: |
          if [ -z "$SUBDOMAIN" ]; then
            echo "::warning::Set the WORKERS_SUBDOMAIN repository variable to post preview links."
            exit 0
          fi
          alias="pr-${{ github.event.number }}"
          body="Previews: [docs](https://${alias}-raster-docs.${SUBDOMAIN}.workers.dev/) · [studio](https://${alias}-raster-studio.${SUBDOMAIN}.workers.dev/)"
          gh pr comment ${{ github.event.number }} --body "$body" --edit-last --create-if-none
